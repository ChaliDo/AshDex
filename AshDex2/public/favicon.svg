<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">AshDex icon</title>
<desc id="desc">A red digital field guide with a yellow lightning bolt emblem.</desc>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff334a"/>
    <stop offset="0.48" stop-color="#d70f2e"/>
    <stop offset="1" stop-color="#8e071e"/>
  </linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2c2730"/>
    <stop offset="1" stop-color="#0f0d12"/>
  </linearGradient>
  <radialGradient id="lens" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#eaf8ff"/>
    <stop offset="0.42" stop-color="#95d8ef"/>
    <stop offset="1" stop-color="#23506b"/>
  </radialGradient>
  <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff36a"/>
    <stop offset="0.5" stop-color="#ffd51f"/>
    <stop offset="1" stop-color="#ff9f00"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".32"/>
  </filter>
  <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#4b2200" flood-opacity=".5"/>
  </filter>
</defs>

<rect width="1024" height="1024" rx="220" fill="#16090b"/>

<g filter="url(#shadow)">
  <rect x="150" y="140" width="724" height="744" rx="150" fill="url(#body)"/>
  <rect x="150" y="140" width="118" height="744" rx="58" fill="url(#spine)"/>
  <rect x="232" y="170" width="20" height="684" rx="10" fill="#5d0d1f" opacity=".75"/>
  <rect x="286" y="180" width="530" height="38" rx="19" fill="#ff6d7c" opacity=".25"/>
</g>

<g>
  <circle cx="326" cy="264" r="70" fill="#091119"/>
  <circle cx="326" cy="264" r="53" fill="url(#lens)"/>
  <circle cx="308" cy="245" r="15" fill="#fff" opacity=".82"/>
  <circle cx="470" cy="235" r="15" fill="#ff4040"/>
  <circle cx="522" cy="235" r="15" fill="#ffd33a"/>
  <circle cx="574" cy="235" r="15" fill="#49d86d"/>
</g>

<g>
  <circle cx="585" cy="545" r="230" fill="#0e0e12"/>
  <circle cx="585" cy="545" r="197" fill="#ececf0"/>
  <circle cx="585" cy="545" r="164" fill="#202026"/>
  <circle cx="585" cy="545" r="124" fill="#f8f8fa"/>
  <circle cx="585" cy="545" r="78" fill="#101014"/>
  <circle cx="585" cy="545" r="44" fill="#f5f5f7"/>
</g>

<g filter="url(#boltShadow)">
  <path d="M610 284 L465 536 H560 L492 755 L722 470 H616 L690 284 Z"
        fill="url(#bolt)" stroke="#16100a" stroke-width="22" stroke-linejoin="round"/>
  <path d="M635 306 L510 520 H592 L540 686 L683 490 H586 L649 306 Z"
        fill="#fff66a" opacity=".35"/>
</g>

<g opacity=".5">
  <path d="M184 790 C330 850 628 870 812 780" fill="none" stroke="#ff6073" stroke-width="18" stroke-linecap="round"/>
</g>
</svg>